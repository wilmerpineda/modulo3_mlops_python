name: Candidato programado (sin promoción automática)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
concurrency:
  group: retraining
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      EVIDENTLY_DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install poetry==2.1.3
      - run: poetry install --no-interaction
      - run: poetry run python -m bank_ops.data
      - run: poetry run python -m bank_ops.cli train --version baseline-v1
      - run: poetry run python -m bank_ops.cli train --version candidate-v2 --kind candidate
      - run: mkdir -p reports && poetry run python -m bank_ops.cli compare --candidate candidate-v2 --incumbent baseline-v1 > reports/comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: |
            artifacts/
            reports/comparison.json
          retention-days: 14
